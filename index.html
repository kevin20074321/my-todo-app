<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d232f;
      --muted: #667085;
      --line: #d9dee8;
      --primary: #1769aa;
      --primary-dark: #105383;
      --danger: #b42318;
      --done: #667085;
      --shadow: 0 18px 50px rgba(20, 32, 50, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        linear-gradient(135deg, rgba(23, 105, 170, 0.08), transparent 34%),
        linear-gradient(315deg, rgba(230, 126, 34, 0.1), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 680px);
      background: var(--panel);
      border: 1px solid rgba(217, 222, 232, 0.8);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    input,
    button {
      min-height: 44px;
      border-radius: 6px;
      font: inherit;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      padding: 0 12px;
      color: var(--text);
      background: #fff;
    }

    input:focus {
      outline: 3px solid rgba(23, 105, 170, 0.18);
      border-color: var(--primary);
    }

    button {
      border: 0;
      padding: 0 14px;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 54px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    li:last-child {
      border-bottom: 0;
    }

    .empty {
      grid-template-columns: 1fr;
      color: var(--muted);
      text-align: center;
      padding: 22px 12px;
    }

    .toggle {
      width: 22px;
      height: 22px;
      min-height: 22px;
      padding: 0;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--primary);
      line-height: 1;
    }

    .toggle:hover {
      background: #edf6fd;
      border-color: var(--primary);
    }

    .todo-text {
      overflow-wrap: anywhere;
    }

    li.done .todo-text {
      color: var(--done);
      text-decoration: line-through;
    }

    li.done .toggle {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    .delete {
      min-height: 34px;
      padding: 0 10px;
      background: transparent;
      color: var(--danger);
      border: 1px solid transparent;
    }

    .delete:hover {
      background: #fff1f0;
      border-color: #fecdca;
    }

    .ai-panel {
      display: grid;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .api-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .summary {
      min-height: 46px;
      margin: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fbfcfe;
    }

    .summary.has-text {
      color: var(--text);
    }

    .error {
      color: var(--danger);
    }

    @media (max-width: 560px) {
      main {
        padding: 20px;
      }

      header,
      form,
      .api-row {
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
        align-items: start;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Todos</h1>
      <div class="count" id="count">0 tasks</div>
    </header>

    <form id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="Add a task" aria-label="Task text" required>
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" aria-label="Todo list"></ul>

    <section class="ai-panel" aria-label="AI summary">
      <div class="api-row">
        <input id="api-key" type="password" placeholder="OpenAI API key" aria-label="OpenAI API key">
        <button id="summarize" type="button">Summarize day</button>
      </div>
      <p class="summary" id="summary">Your summary will appear here.</p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "plain-todo-items";

    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const list = document.querySelector("#todo-list");
    const count = document.querySelector("#count");
    const apiKeyInput = document.querySelector("#api-key");
    const summarizeButton = document.querySelector("#summarize");
    const summary = document.querySelector("#summary");

    let todos = loadTodos();

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function renderTodos() {
      list.innerHTML = "";

      if (todos.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty";
        emptyItem.textContent = "No tasks yet.";
        list.appendChild(emptyItem);
      } else {
        todos.forEach((todo) => {
          const item = document.createElement("li");
          item.className = todo.done ? "done" : "";

          const toggle = document.createElement("button");
          toggle.className = "toggle";
          toggle.type = "button";
          toggle.textContent = todo.done ? "✓" : "";
          toggle.setAttribute("aria-label", todo.done ? "Mark task not done" : "Mark task done");
          toggle.addEventListener("click", () => toggleTodo(todo.id));

          const text = document.createElement("span");
          text.className = "todo-text";
          text.textContent = todo.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete";
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", () => deleteTodo(todo.id));

          item.append(toggle, text, deleteButton);
          list.appendChild(item);
        });
      }

      const done = todos.filter((todo) => todo.done).length;
      const total = todos.length;
      count.textContent = `${done}/${total} done`;
    }

    function addTodo(text) {
      todos = [
        ...todos,
        {
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          text,
          done: false
        }
      ];
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, done: !todo.done } : todo
      );
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    function todoListText() {
      if (todos.length === 0) {
        return "No todo items.";
      }

      return todos
        .map((todo) => `${todo.done ? "[done]" : "[todo]"} ${todo.text}`)
        .join("\n");
    }

    async function summarizeDay() {
      const apiKey = apiKeyInput.value.trim();

      summary.className = "summary";
      if (!apiKey) {
        summary.textContent = "Add an API key first.";
        summary.classList.add("error", "has-text");
        return;
      }

      summarizeButton.disabled = true;
      summarizeButton.textContent = "Summarizing...";
      summary.textContent = "Asking AI...";

      try {
        const response = await fetch("https://api.openai.com/v1/responses", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4.1-mini",
            input: [
              {
                role: "system",
                content: "Summarize this todo list in exactly one short sentence."
              },
              {
                role: "user",
                content: todoListText()
              }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "The AI request failed.");
        }

        const text =
          data.output_text ||
          data.output?.flatMap((item) => item.content || [])
            .map((part) => part.text || "")
            .join(" ")
            .trim();

        summary.textContent = text || "No summary was returned.";
        summary.classList.add("has-text");
      } catch (error) {
        summary.textContent = error.message;
        summary.classList.add("error", "has-text");
      } finally {
        summarizeButton.disabled = false;
        summarizeButton.textContent = "Summarize day";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text) {
        return;
      }

      addTodo(text);
      input.value = "";
      input.focus();
    });

    summarizeButton.addEventListener("click", summarizeDay);

    renderTodos();
  </script>
</body>
</html>
